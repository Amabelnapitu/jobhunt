# Search profile: what to search for and how to rank results.
# Edit freely; no personal contact details belong here (this repo is public).
#
# Target: junior-level roles. Preference order: Product Management (especially AI / insurtech),
# then Business Analyst, then anything else that fits: AI enablement, data, actuarial-adjacent,
# project roles.

[search]
# Each query is sent to every source. Keep them short, like you'd type into a job board.
queries = [
  # Product (main preference)
  "associate product manager",
  "junior product manager",
  "product manager AI",
  "AI product",
  "product analyst",
  "product owner",
  "product manager insurance",
  "digital product insurance",
  # Business analysis
  "business analyst",
  "junior business analyst",
  "business analyst insurance",
  "business analyst AI",
  # Other good fits
  "AI enablement",
  "generative AI",
  "LLM",
  "knowledge management AI",
  "data analyst insurance",
  "financial reporting analyst insurance",
  "actuarial analyst",
  "assistant project manager",
  "graduate programme",
]
location = "Hong Kong"
days = 14            # only jobs posted within this many days (where the source supports it)
max_pages = 3        # pages per query per source

# Facts about you that decide eligibility. Only what you've confirmed; edit if anything changes.
[candidate]
work_rights = "IANG"            # Hong Kong IANG visa: no sponsorship needed
permanent_resident = false
# Experience: APM at FWD since June 2026 (contract ends Dec 2026), plus internships.
max_years_qualified = 1         # postings asking for up to this many years: qualified
max_years_stretch = 2           # up to this many: shown as a stretch ("check"); more: not eligible
[candidate.languages]           # none | basic | conversational | fluent | native
english = "fluent"
korean = "fluent"
bahasa = "native"
mandarin = "conversational"
cantonese = "none"
written_chinese = "none"

[ranking]
daily_picks = 20                # how many top jobs to put up for applying each day
# Weights for rank_score (0-100). Ineligible jobs are never ranked.
fit = 0.40                      # match with this profile
interview = 0.35                # estimated chance of an interview
freshness = 0.25                # newer postings first
fit_full_marks = 50             # keyword score that counts as a perfect fit
check_factor = 0.85             # discount for "check" jobs (stretch or unclear)
detail_min_score = 10           # only open the job page for jobs scoring at least this
max_details_per_run = 80        # politeness cap on job pages opened per run
max_enrich_per_run = 40         # jobs looked up elsewhere (employer site, JobsDB) per run

[scoring]
# Whole-word/phrase matches, case-insensitive. Weight counts x2 if found in the title, x1 if only in the snippet.
[scoring.keywords]
# Role (preference order)
"product manager" = 10
"product owner" = 8
"product analyst" = 8
"product management" = 6
"product specialist" = 4
"digital product" = 4
"business analyst" = 7
"business analysis" = 4
"systems analyst" = 3
"project manager" = 4
"project coordinator" = 3
"pmo" = 3
# What you've built at FWD: LLM wiki, knowledge graphs, vector DB, AI enablement
"genai" = 6
"generative ai" = 6
"llm" = 6
"large language model" = 5
"rag" = 4
"knowledge graph" = 5
"vector database" = 4
"ai enablement" = 5
"ai adoption" = 4
"ai" = 4
"artificial intelligence" = 4
"machine learning" = 3
"prompt" = 2
"knowledge management" = 4
"automation" = 2
"digital transformation" = 3
"transformation" = 2
# Domain
"actuarial" = 5
"insurance" = 4
"insurtech" = 4
"fintech" = 3
"financial reporting" = 4
"valuation" = 3
"ifrs 17" = 4
"hkrbc" = 4
"regulatory" = 2
# Ways of working and tools
"agile" = 2
"scrum" = 2
"user stories" = 2
"requirements" = 2
"uat" = 2
"jira" = 1
"stakeholder" = 1
"python" = 2
"sql" = 2
"power bi" = 2
"analytics" = 2
"dashboard" = 1
# Languages
"korean" = 3
"bahasa" = 3
"indonesian" = 3

# Title words that make a role a poor fit: too senior for a junior move, or a different field
# (HK has many construction/engineering "project manager" roles).
[scoring.penalties]
"director" = -15
"head of" = -15
"vice president" = -12
"vp" = -12
"svp" = -12
"chief" = -20
"principal" = -8
"senior" = -10
"sr" = -10
"lead" = -6
"construction" = -20
"building" = -20
"site" = -20
"civil" = -20
"m&e" = -20
"e&m" = -20
"electrical" = -20
"mechanical" = -20
"interior" = -20
"fitting out" = -20
"quantity surveyor" = -20
"architect" = -12
# Engineering and research roles: AI-heavy postings rank high on keywords, but they hire
# engineers, not product/BA people.
"engineer" = -15
"engineering" = -8
"developer" = -15
"programmer" = -15
"scientist" = -10
"researcher" = -8
# In HK retail/FMCG/pharma, "Assistant Product Manager" is usually brand marketing.
"beauty" = -12
"body care" = -12
"cosmetics" = -12
"skincare" = -12
"fashion" = -12
"fmcg" = -12
"merchandiser" = -12
"merchandising" = -12
"buyer" = -10
"intern" = -6
"internship" = -6
"sales" = -6
"agent" = -6
"telemarketing" = -20

# Bonus for titles at the level you're targeting.
# Words anywhere in the posting (title, summary or description) that point to consumer-brand
# product marketing rather than digital/tech product work. Counted once each.
[scoring.context_penalties]
"brand building" = -6
"brand management" = -6
"merchandising" = -6
"product sourcing" = -6
"consumer products" = -4
"fmcg" = -6
"health supplements" = -6
"cosmetic" = -6
"skincare" = -6
"retail stores" = -4

[scoring.level_bonus]
"junior" = 5
"associate" = 5
"assistant" = 4
"graduate" = 3
"entry level" = 3
"analyst" = 3
"trainee" = 2
"officer" = 1
"specialist" = 1

# Bonus by role family (see [categories]): this is where the preference order lives.
[scoring.category_bonus]
product = 8
business_analysis = 4
ai_data = 2

# Role family, decided from the job title. The first category with a matching keyword wins,
# so order matters. Used for filtering: `python -m jobhunt list --category product`.
[categories]
product = ["product manager", "product owner", "product analyst", "product management",
           "product specialist", "digital product", "product lead"]
business_analysis = ["business analyst", "business analysis", "systems analyst", "functional analyst",
                     "business systems"]
ai_data = ["genai", "generative ai", "llm", "ai", "artificial intelligence", "machine learning",
           "data analyst", "data scientist", "data", "analytics", "knowledge management"]
actuarial_finance = ["actuarial", "actuary", "valuation", "financial reporting", "ifrs", "finance"]
project = ["project manager", "project coordinator", "project officer", "pmo", "programme"]
